apiVersion: batch/v1
kind: CronJob
metadata:
  name: minecraft-idle-watcher
  namespace: games
spec:
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # No retries: a failed run is superseded by the next 2-minute tick,
      # and each retry leaves another Error pod behind.
      backoffLimit: 0
      template:
        spec:
          serviceAccountName: minecraft-idle-watcher
          restartPolicy: Never
          containers:
            - name: watcher
              image: python:3.11-alpine
              command: ["python3", "/scripts/watcher.py"]
              env:
                - name: TTL_SECONDS
                  value: "300"
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
          volumes:
            - name: scripts
              configMap:
                name: minecraft-idle-watcher-script
