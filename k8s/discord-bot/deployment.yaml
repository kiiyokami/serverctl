apiVersion: apps/v1
kind: Deployment
metadata:
  name: minecraft-discord-bot
  namespace: games
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minecraft-discord-bot
  template:
    metadata:
      labels:
        app: minecraft-discord-bot
    spec:
      serviceAccountName: minecraft-discord-bot
      containers:
        - name: bot
          image: serverctl-bot:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: minecraft-discord-bot
          env:
            - name: SERVERCTL_REPO_ROOT
              value: /serverctl
            - name: RUST_LOG
              value: info
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          volumeMounts:
            - name: serverctl-repo
              mountPath: /serverctl
      volumes:
        - name: serverctl-repo
          hostPath:
            # install-bot.sh replaces this with the repo's real path at apply time.
            path: /home/REPLACE_ME/serverctl
            type: Directory
