{{- if .Values.pvc.create }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.name }}-data
  namespace: games
  # helm uninstall would otherwise delete the world; /delete purge:true removes it explicitly.
  annotations:
    helm.sh/resource-policy: keep
    {{- if .Values.discordGuildId }}
    # Lets /delete purge:true find a kept world's owner after its server is gone.
    serverctl.io/discord-guild-id: {{ .Values.discordGuildId | quote }}
    {{- end }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: {{ .Values.storage }}
{{- end }}
