apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: games
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.name }}
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: minecraft
          image: {{ .Values.image | default "itzg/minecraft-server:latest" }}
          env:
            - name: EULA
              value: "TRUE"
            {{- $extra := .Values.extraEnv | default dict }}
            {{- if not (hasKey $extra "TYPE") }}
            - name: TYPE
              value: {{ .Values.server.type | quote }}
            {{- end }}
            {{- if not (hasKey $extra "VERSION") }}
            - name: VERSION
              value: {{ .Values.server.version | quote }}
            {{- end }}
            {{- if not (hasKey $extra "MEMORY") }}
            - name: MEMORY
              value: {{ .Values.server.memory | quote }}
            {{- end }}
            {{- if not (hasKey $extra "ONLINE_MODE") }}
            - name: ONLINE_MODE
              value: {{ .Values.server.onlineMode | ternary "TRUE" "FALSE" | quote }}
            {{- end }}
            {{- if not (hasKey $extra "JAVA_TOOL_OPTIONS") }}
            - name: JAVA_TOOL_OPTIONS
              value: "-Djava.net.preferIPv4Stack=true"
            {{- end }}
            {{- if and .Values.server.mods (not (hasKey $extra "MODS")) }}
            - name: MODS
              value: {{ .Values.server.mods | join "," | quote }}
            {{- end }}
            {{- range $k, $v := $extra }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          ports:
            - containerPort: 25565
          resources:
            requests:
              memory: {{ .Values.resources.requests.memory | quote }}
              cpu: {{ .Values.resources.requests.cpu | quote }}
            limits:
              memory: {{ .Values.resources.limits.memory | quote }}
              cpu: {{ .Values.resources.limits.cpu | quote }}
          # Modpacks can take several minutes to finish worldgen on first boot.
          # startupProbe gates liveness/readiness until the server actually accepts TCP.
          startupProbe:
            tcpSocket:
              port: 25565
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 60      # up to 10 minutes
          readinessProbe:
            tcpSocket:
              port: 25565
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 25565
            periodSeconds: 30
            failureThreshold: 5       # tolerate brief lag spikes
          volumeMounts:
            - mountPath: /data
              name: world-data
      volumes:
        - name: world-data
          persistentVolumeClaim:
            claimName: {{ .Values.name }}-data
