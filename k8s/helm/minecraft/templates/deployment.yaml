apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: games
  {{- if .Values.discordGuildId }}
  annotations:
    serverctl.io/discord-guild-id: {{ .Values.discordGuildId | quote }}
  {{- end }}
spec:
  replicas: {{ .Values.replicas }}
  # hostNetwork + a ReadWriteOnce PVC mean old and new pods can never coexist,
  # so RollingUpdate deadlocks (new pod Pending forever). Kill-then-replace.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Values.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.name }}
    spec:
      # Host network shares the node's ports, so each server listens on its own port.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- if .Values.cfApiKeyUser }}
      initContainers:
        # Before itzg runs the (API-heavy) CurseForge install, wait until the
        # CurseForge API is reachable/un-throttled, with exponential backoff.
        # This stops the pod from re-hammering the API on restart after a 403/
        # rate-limit, while itzg resumes from the cached /data on the next pass.
        - name: cf-ratelimit-gate
          image: {{ .Values.image | default "itzg/minecraft-server:latest" }}
          command: ["bash", "-c"]
          env:
            - name: CF_API_KEY
              valueFrom:
                secretKeyRef:
                  name: curseforge-keys
                  key: {{ .Values.cfApiKeyUser | quote }}
            {{- range $k, $v := (.Values.extraEnv | default dict) }}
            {{- if has $k (list "CF_PAGE_URL" "CF_SERVER_MOD" "CF_SERVER_PACK_URL") }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- end }}
          volumeMounts:
            - mountPath: /data
              name: world-data
          args:
            - |
              set -u
              # Server packs: fetch with the API key (the CDN requires one), once per file.
              if [ -n "${CF_SERVER_PACK_URL:-}" ] && [ ! -f "${CF_SERVER_MOD}" ]; then
                echo "[cf-gate] downloading server pack to ${CF_SERVER_MOD}"
                curl -fL --retry 3 -H "x-api-key: ${CF_API_KEY}" \
                  -o "${CF_SERVER_MOD}.part" "${CF_SERVER_PACK_URL}" || exit 1
                mv "${CF_SERVER_MOD}.part" "${CF_SERVER_MOD}"
                chown 1000:1000 "${CF_SERVER_MOD}"
              fi
              slug="${CF_PAGE_URL##*/}"
              if [ -z "${slug:-}" ]; then echo "[cf-gate] no CF_PAGE_URL slug; skipping"; exit 0; fi
              url="https://api.curseforge.com/v1/mods/search?gameId=432&slug=${slug}"
              i=0
              while :; do
                code=$(curl -s -o /dev/null -w '%{http_code}' -H "x-api-key: ${CF_API_KEY}" "$url")
                if [ "$code" = "200" ]; then echo "[cf-gate] CurseForge API ready"; exit 0; fi
                i=$((i + 1))
                if [ "$i" -ge 8 ]; then echo "[cf-gate] API still $code after $i tries; proceeding anyway"; exit 0; fi
                d=$((i * 30)); [ "$d" -gt 300 ] && d=300
                echo "[cf-gate] API returned $code (try $i); backing off ${d}s"
                sleep "$d"
              done
      {{- end }}
      containers:
        - name: minecraft
          image: {{ .Values.image | default "itzg/minecraft-server:latest" }}
          env:
            - name: EULA
              value: "TRUE"
            {{- $extra := .Values.extraEnv | default dict }}
            {{- if not (hasKey $extra "TYPE") }}
            - name: TYPE
              value: {{ .Values.server.type | quote }}
            {{- end }}
            {{- if not (hasKey $extra "VERSION") }}
            - name: VERSION
              value: {{ .Values.server.version | quote }}
            {{- end }}
            {{- if not (hasKey $extra "MEMORY") }}
            - name: MEMORY
              value: {{ .Values.server.memory | quote }}
            {{- end }}
            {{- if not (hasKey $extra "SERVER_PORT") }}
            - name: SERVER_PORT
              value: {{ include "minecraft.port" . | quote }}
            {{- end }}
            {{- if not (hasKey $extra "ONLINE_MODE") }}
            - name: ONLINE_MODE
              value: {{ .Values.server.onlineMode | ternary "TRUE" "FALSE" | quote }}
            {{- end }}
            {{- if not (hasKey $extra "JAVA_TOOL_OPTIONS") }}
            - name: JAVA_TOOL_OPTIONS
              value: "-Djava.net.preferIPv4Stack=true"
            {{- end }}
            {{- if and .Values.server.mods (not (hasKey $extra "MODS")) }}
            - name: MODS
              value: {{ .Values.server.mods | join "," | quote }}
            {{- end }}
            {{- if and .Values.server.plugins (not (hasKey $extra "PLUGINS")) }}
            - name: PLUGINS
              value: {{ .Values.server.plugins | join "," | quote }}
            {{- end }}
            {{- if and .Values.server.curseforgeFiles (not (hasKey $extra "CURSEFORGE_FILES")) }}
            - name: CURSEFORGE_FILES
              value: {{ .Values.server.curseforgeFiles | join "," | quote }}
            {{- end }}
            {{- if .Values.cfApiKeyUser }}
            - name: CF_API_KEY
              valueFrom:
                secretKeyRef:
                  name: curseforge-keys
                  key: {{ .Values.cfApiKeyUser | quote }}
            {{- end }}
            {{- range $k, $v := $extra }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          ports:
            - containerPort: {{ include "minecraft.port" . }}
          resources:
            requests:
              memory: {{ .Values.resources.requests.memory | quote }}
              cpu: {{ .Values.resources.requests.cpu | quote }}
            limits:
              memory: {{ .Values.resources.limits.memory | quote }}
              cpu: {{ .Values.resources.limits.cpu | quote }}
          startupProbe:
            tcpSocket:
              port: {{ include "minecraft.port" . }}
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: {{ include "minecraft.port" . }}
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: {{ include "minecraft.port" . }}
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - mountPath: /data
              name: world-data
      volumes:
        - name: world-data
          persistentVolumeClaim:
            claimName: {{ .Values.name }}-data
