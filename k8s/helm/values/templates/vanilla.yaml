# Vanilla server template
# Copy to k8s/helm/values/servers/<your-name>.yaml and fill in name + nodePort.
#
# Public ports 25565–25568 map to NodePorts 30565–30568.
# Pick any unused port from 30565–30568.

name: ""        # required: unique name for this server
nodePort: 30565 # required: pick an unused port from 30565–30568

server:
  type: VANILLA
  version: "LATEST"
  memory: "8G"
  onlineMode: true
  mods: []

resources:
  requests:
    memory: "8Gi"
    cpu: "1"
  limits:
    memory: "10Gi"
    cpu: "4"

storage: 20Gi
