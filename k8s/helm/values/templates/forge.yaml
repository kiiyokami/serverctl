# Forge server template
# Copy to k8s/helm/values/servers/<your-name>.yaml and fill in name + nodePort.
#
# Public ports 25565–25568 map to NodePorts 30565–30568.
# Pick any unused port from 30565–30568.

name: ""        # required: unique name for this server
nodePort: 30567 # required: pick an unused port from 30565–30568

server:
  type: FORGE
  version: "LATEST"
  memory: "14G"
  onlineMode: true
  mods: []

resources:
  requests:
    memory: "14Gi"
    cpu: "2"
  limits:
    memory: "20Gi"
    cpu: "4"

storage: 100Gi

extraEnv:
  JVM_OPTS: "-XX:+UseZGC -XX:+ZGenerational"
