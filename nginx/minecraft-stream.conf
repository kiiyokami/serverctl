# Minecraft stream proxy config for the public VPS.
# Before deploying, replace <WG_HOME_IP> with the WireGuard IP of your home server.
#
# Ports 25565–25568 (public) proxy to NodePorts 30565–30568 (home server k3s).

upstream mc-30565 { server <WG_HOME_IP>:30565; }
upstream mc-30566 { server <WG_HOME_IP>:30566; }
upstream mc-30567 { server <WG_HOME_IP>:30567; }
upstream mc-30568 { server <WG_HOME_IP>:30568; }

server { listen 25565; proxy_pass mc-30565; proxy_timeout 600s; proxy_connect_timeout 10s; }
server { listen 25566; proxy_pass mc-30566; proxy_timeout 600s; proxy_connect_timeout 10s; }
server { listen 25567; proxy_pass mc-30567; proxy_timeout 600s; proxy_connect_timeout 10s; }
server { listen 25568; proxy_pass mc-30568; proxy_timeout 600s; proxy_connect_timeout 10s; }
