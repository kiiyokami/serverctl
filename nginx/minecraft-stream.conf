# Minecraft: vanilla-chill
# NodePort 30565 on SER8 -> public port 25565
# Friends connect to: mc.kiiyo.top:25565
#
# To add a new server:
#   1. Add a new upstream block pointing to its NodePort
#   2. Add a new server block listening on the next public port (25566, 25567, ...)
#   3. Run: sudo nginx -s reload on the DO droplet

upstream minecraft-vanilla-chill {
    server <WG_HOME_IP>:30565;
}

server {
    listen 25565;
    proxy_pass minecraft-vanilla-chill;
    proxy_timeout 600s;
    proxy_connect_timeout 10s;
}
