# Minecraft servers — mc.kiiyo.top
#
# Ports 25565–25568 proxy to NodePorts 30565–30568 on the SER8 (WireGuard IP: 10.66.66.2).
# Configure this once — no changes needed when adding new servers.
#
#   mc.kiiyo.top:25565  →  SER8:30565
#   mc.kiiyo.top:25566  →  SER8:30566
#   mc.kiiyo.top:25567  →  SER8:30567
#   mc.kiiyo.top:25568  →  SER8:30568

upstream mc-30565 { server 10.66.66.2:30565; }
upstream mc-30566 { server 10.66.66.2:30566; }
upstream mc-30567 { server 10.66.66.2:30567; }
upstream mc-30568 { server 10.66.66.2:30568; }

server { listen 25565; proxy_pass mc-30565; proxy_timeout 600s; proxy_connect_timeout 10s; }
server { listen 25566; proxy_pass mc-30566; proxy_timeout 600s; proxy_connect_timeout 10s; }
server { listen 25567; proxy_pass mc-30567; proxy_timeout 600s; proxy_connect_timeout 10s; }
server { listen 25568; proxy_pass mc-30568; proxy_timeout 600s; proxy_connect_timeout 10s; }
